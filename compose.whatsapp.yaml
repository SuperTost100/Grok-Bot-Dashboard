# Runs WAHA (https://waha.devlike.pro) next to the dashboard so it can read WhatsApp.
# WAHA links to your account like WhatsApp Web; the dashboard only reads through it.
# Turn it on in .env with:
#   WAHA_API_KEY=<a random secret, like: openssl rand -hex 24>
#   COMPOSE_FILE=compose.yaml:compose.whatsapp.yaml
# Then open Settings on the dashboard and scan the QR code under WhatsApp.
services:
  waha:
    image: devlikeapro/waha:noweb-2026.9.2
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?set WAHA_API_KEY in .env}
      # NOWEB talks to WhatsApp without a browser, so it needs far less memory than WEBJS.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "False"
      WAHA_DASHBOARD_ENABLED: "False"
      WHATSAPP_SWAGGER_ENABLED: "False"
    # No published port: only the dashboard, on the same Compose network, can reach it.
    volumes:
      - ./data/waha/sessions:/app/.sessions
      - ./data/waha/media:/app/.media

  dashboard:
    environment:
      WAHA_URL: http://waha:3000
