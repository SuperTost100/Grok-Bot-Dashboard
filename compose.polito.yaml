# Lets the dashboard reach areadidattica (https://github.com/SuperTost100/areadidattica-cli)
# over that project's Compose network. Turn it on in .env with:
#   COMPOSE_FILE=compose.yaml:compose.polito.yaml
services:
  dashboard:
    networks: [default, areadidattica]

networks:
  areadidattica:
    external: true
    # Compose names it after the folder areadidattica runs from: <folder>_default.
    name: ${AREADIDATTICA_NETWORK:-areadidattica_default}
