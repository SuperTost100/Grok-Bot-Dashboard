name: grok-bot-dashboard

services:
  dashboard:
    build: .
    image: grok-bot-dashboard
    restart: unless-stopped
    # Runs as your user so it can write ./data. Set DASHBOARD_UID/DASHBOARD_GID in .env if yours isn't 1000 (check with: id -u).
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1000}"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      RUNNER_URL: http://runner:8790
      RUNNER_KEY_FILE: /run/runner/runner.key
      # Your browser arrives through Docker's port mapping, add-ons and apps don't: see server/config.ts.
      OWNER_VIA: gateway
    # Only this machine can reach the port. Tailscale Serve puts it on your tailnet.
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    volumes:
      - ./data:/data
      - runner-key:/run/runner:ro
    networks: [default, admin]

  # Starts apps and untrusted add-ons in containers. It's the only service with the Docker socket,
  # which is as good as root here, so it's kept apart: of the dashboard's networks it shares only
  # "admin", gets none of .env, answers only the key it writes into runner-key at its first
  # start, and starts nothing that fails runner/validate.mjs. Remove it to turn apps off.
  runner:
    build: ./runner
    image: grok-bot-dashboard-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-apps:/apps
      - runner-key:/keys
    networks: [admin]

volumes:
  runner-apps:
  runner-key:

networks:
  # Apps and untrusted add-ons join this one to reach the dashboard at http://dashboard:8787.
  default:
    name: grokdash
  # The dashboard and the runner only. Not "internal": the runner's builds fetch registry
  # tokens and base images over it. Apps never join it, so they can't reach the runner.
  admin:
    name: grokdash-admin
